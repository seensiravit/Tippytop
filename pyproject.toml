[project]
name = "autoresearch-lg"
version = "0.1.0"
description = "LangGraph harness for the KuaiRand-Pure autoresearch loop"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-sdk",
    "anthropic>=0.40",
    "openai>=1.0",
    "colorama; sys_platform == 'win32'",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autoresearch_lg"]
