[project]
name = "tippytop"
version = "0.1.0"
description = "Autonomous ML research agent for the KuaiRand-Pure ranking benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.6,<5",
  "numpy>=2.0",
  "pandas>=3,<4",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
tippytop = "tippytop.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
